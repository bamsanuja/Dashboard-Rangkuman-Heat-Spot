# Menerbitkan situs ke GitHub Pages lewat branch gh-pages.
#
# Kenapa memakai cara ini, bukan actions/deploy-pages yang lebih baru:
# repositori ini sejak awal disetel menyajikan Pages dari branch gh-pages, dan
# environment `github-pages` di sini punya kebijakan yang hanya mengizinkan
# branch gh-pages. Cara baru menuntut sumber Pages disetel ke "GitHub Actions"
# DAN main dimasukkan ke daftar izin environment, dua setelan yang harus diubah
# lewat antarmuka web.
#
# Mendorong ke branch gh-pages adalah dorongan git biasa, sehingga tidak
# menyentuh environment sama sekali. Hasilnya sama, tanpa satu pun klik setelan.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Dipanggil langsung oleh workflow FDRS setelah ia menyimpan grid harian.
  # Ini bukan kemewahan: GitHub sengaja TIDAK memicu workflow untuk dorongan
  # yang memakai GITHUB_TOKEN bawaan, sebagai pencegah putaran tak berujung.
  # Jadi commit FDRS tidak pernah menyalakan pemicu `push` di atas, dan tanpa
  # panggilan langsung ini datanya akan mendarat di repositori tanpa pernah
  # tayang. Panggilan `workflow_call` tidak lewat pemicu peristiwa, sehingga
  # larangan itu tidak berlaku dan tidak perlu PAT.
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sengaja mengambil ujung branch, bukan SHA pemicu. Saat dipanggil
          # workflow FDRS, SHA pemicu masih commit sebelum grid disimpan,
          # sehingga hasil build-nya justru tidak memuat data yang baru saja
          # diambil. Ujung branch selalu yang terbaru.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Dorong hasil build ke branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Dorongan ke gh-pages tidak memicu workflow ini lagi, karena
          # pemicunya hanya push ke main. Tidak ada risiko putaran tak berujung.
          commit_message: 'deploy: ${{ github.event.head_commit.message || github.sha }}'
