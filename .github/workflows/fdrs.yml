# Mengambil grid Fire Danger Rating harian dan menyimpannya ke repositori.
#
# Inilah yang menghapus langkah terminal. Skrip berjalan di server GitHub,
# bukan di komputer siapa pun. Setelah grid tersimpan, workflow ini memanggil
# workflow penerbitan secara langsung, sehingga situsnya ikut diperbarui.
# Aplikasi kemudian memuat grid itu dari alamatnya sendiri, jadi tidak ada
# halangan CORS dan tidak ada yang perlu mengimpor apa pun.
#
# Panggilan langsung itu penting. Dorongan yang memakai GITHUB_TOKEN bawaan
# sengaja tidak memicu workflow lain, jadi commit di bawah TIDAK akan
# menyalakan pemicu `push` milik workflow penerbitan. Tanpa panggilan eksplisit
# di job `terbitkan`, grid harian akan mendarat di repositori tanpa pernah
# tayang di situs.
#
# Dua cara menjalankan:
#   1. Otomatis setiap hari pukul 02:00 UTC, yaitu 09:00 WIB.
#   2. Manual: buka tab Actions di halaman GitHub repositori ini, pilih
#      workflow ini, lalu klik "Run workflow". Tanpa terminal.
name: Perbarui data tingkat bahaya kebakaran

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tanggal:
        description: 'Tanggal observasi (YYYY-MM-DD). Kosongkan untuk memakai kemarin.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fdrs
  cancel-in-progress: false

jobs:
  ambil:
    runs-on: ubuntu-latest
    outputs:
      berubah: ${{ steps.simpan.outputs.berubah }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pasang dependensi Python
        run: pip install xarray netCDF4 requests

      - name: Ambil grid FDRS
        run: |
          mkdir -p public
          if [ -n "${{ inputs.tanggal }}" ]; then
            TANGGAL="${{ inputs.tanggal }}"
          else
            TANGGAL=$(date -u -d 'yesterday' +%Y-%m-%d)
          fi

          # GFWED kadang terlambat terbit. Mundur sampai tiga hari sebelum
          # menyerah, daripada meninggalkan situs tanpa data sama sekali.
          BERHASIL=0
          for MUNDUR in 0 1 2 3; do
            COBA=$(date -u -d "$TANGGAL -$MUNDUR day" +%Y-%m-%d)
            echo "::group::Mencoba $COBA"
            if python scripts/fetch-fdrs.py "$COBA" --out public/fdrs-latest.json; then
              BERHASIL=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done

          if [ "$BERHASIL" -ne 1 ]; then
            echo "::error::Tidak ada tanggal yang tersedia dalam rentang empat hari terakhir."
            exit 1
          fi

      - name: Simpan ke repositori
        id: simpan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fdrs-latest.json
          if git diff --staged --quiet; then
            echo "Grid tidak berubah, tidak ada yang perlu disimpan."
            echo "berubah=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: perbarui grid FDRS"
            git push
            echo "berubah=true" >> "$GITHUB_OUTPUT"
          fi

  # Menerbitkan ulang situs supaya grid yang baru saja disimpan benar-benar
  # tayang. Dilewati kalau gridnya tidak berubah, agar tidak ada build sia-sia.
  terbitkan:
    needs: ambil
    if: needs.ambil.outputs.berubah == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
